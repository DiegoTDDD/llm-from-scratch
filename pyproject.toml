[project]
name = "llm-from-scratch"
version = "1.0.0"
description = "A GPT-style language model, BPE tokenizer and KV-cache decoding written from scratch in PyTorch, trained on SEC 10-K filings on a CPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=1.26"]

[project.optional-dependencies]
train = ["edgartools==5.40.1", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "RUF", "ANN"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"scripts/**" = ["T20"]
