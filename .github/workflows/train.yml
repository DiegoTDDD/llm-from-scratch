name: train

# Builds the SEC corpus, trains the tokenizer and the model on the runner's CPU, benchmarks
# the KV cache, commits results/ and attaches the checkpoint to a release.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Optimizer steps (the cosine schedule spans this many)
        default: "4000"
      max_minutes:
        description: Stop training after this many minutes, whatever the step
        default: "200"

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Build the corpus from SEC EDGAR
        env:
          SEC_IDENTITY: llm-from-scratch DiegoTDDD@users.noreply.github.com
        run: |
          python scripts/prepare_corpus.py
          cp data/corpus_manifest.json results/corpus_manifest.json
      - name: Train
        run: python scripts/train.py --steps "${{ inputs.steps }}" --max-minutes "${{ inputs.max_minutes }}"
      - name: Benchmark the KV cache
        run: python scripts/benchmark.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Training run ${{ github.run_id }}: results" || echo "no changes"
          git push
      - name: Release the checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="model-${{ github.run_id }}"
          gh release create "$tag" checkpoints/gpt_sec.pt results/tokenizer.json \
            --title "Checkpoint from training run ${{ github.run_id }}" \
            --notes "Best-validation checkpoint and tokenizer. Metrics: results/metrics.json at this commit."
